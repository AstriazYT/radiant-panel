<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radiant - Panel de Gestion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Panel de Gestion - Radiant Survie</h1>

        <!-- Statut Serveur -->
        <div class="card">
            <h2>Statut du Serveur</h2>
            <p>État : <span class="status-badge online">En ligne</span></p>
            <p class="ip-info">IP : eu17-free.falixserver.net</p>
        </div>

        <!-- Formulaire de Configuration -->
        <div class="card">
            <h2>Configuration du Launcher</h2>
            
            <div class="switch-container">
                <input type="checkbox" id="maintenance-mode">
                <label for="maintenance-mode">Activer le mode maintenance</label>
            </div>

            <div class="form-group">
                <label for="announcement-text">Message d'annonce global :</label>
                <textarea id="announcement-text" rows="3" placeholder="Entrez votre message ici..."></textarea>
            </div>

            <div class="form-group">
                <label for="latest-version">Dernière version du launcher :</label>
                <input type="text" id="latest-version" placeholder="v1.0.4">
            </div>

            <div class="form-group">
                <label for="admin-key">Clé d'administration (Mot de passe) :</label>
                <input type="password" id="admin-key" placeholder="Entrez la clé secrète">
            </div>

            <button onclick="saveConfig()">Sauvegarder les modifications</button>
        </div>
    </div>

    <script>
        // Charger la config actuelle au démarrage
        fetch('../config.json?t=' + Date.now())
            .then(res => res.json())
            .then(data => {
                document.getElementById('maintenance-mode').checked = data.maintenance || false;
                document.getElementById('announcement-text').value = data.announcement || '';
                document.getElementById('latest-version').value = data.latestVersion || 'v1.0.4';
            })
            .catch(() => console.log('Nouvelle config ou fichier introuvable.'));

        // Envoyer la mise à jour au script PHP
        async function saveConfig() {
            const maintenance = document.getElementById('maintenance-mode').checked;
            const announcement = document.getElementById('announcement-text').value;
            const version = document.getElementById('latest-version').value;
            const key = document.getElementById('admin-key').value;

            if (!key) {
                alert("Veuillez entrer la clé d'administration !");
                return;
            }

            const payload = {
                key: key,
                maintenance: maintenance,
                announcement: announcement,
                latestVersion: version,
                downloadUrl: "https://github.com/AstriazYT/minecraft-rubis-launcher/releases/latest/download/radiant-launcher.exe"
            };

            try {
                const response = await fetch('api/update.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();
                if (result.success) {
                    alert("Configuration sauvegardée avec succès !");
                } else {
                    alert("Erreur : " + result.message);
                }
            } catch (err) {
                alert("Erreur de connexion au serveur.");
            }
        }
    </script>
</body>
</html>
